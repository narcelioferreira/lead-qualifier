name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions fixadas por SHA de commit (imutável), não por tag móvel (OWASP ASI04 / AST02).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Instalar dependências
        # --locked: falha se o uv.lock divergir; o uv confere o hash de cada pacote baixado.
        run: uv sync --locked
      - name: Lint, tipos, testes e segurança
        run: make check
