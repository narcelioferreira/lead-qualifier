# Catálogo de modelos e preço de lista por 1M de tokens (US$).
# Preços conferidos em 2026-10-21 em https://console.groq.com/docs/model/<modelo>.
# No plano gratuito da Groq o custo real é zero; o preço de lista é mantido para reportar o
# custo equivalente por lead na avaliação.
# Os modelos da Groq são de pesos abertos: o ID aponta para pesos fixos, sem alias móvel.
# Só entram modelos de produção com structured output estrito (preview pode sumir sem aviso).
version: 1
prices_checked_at: 2026-10-21
models:
  groq-mini:
    provider: groq
    kind: chat
    model: openai/gpt-oss-20b
    reasoning_effort: low
    max_output_tokens: 4000
    price_per_1m: {input: 0.075, cached_input: 0.037, output: 0.30}
  groq-large:
    provider: groq
    kind: chat
    model: openai/gpt-oss-120b
    reasoning_effort: medium
    max_output_tokens: 8000
    price_per_1m: {input: 0.15, cached_input: 0.075, output: 0.60}
  # SLM local (guardrail e normalização de cargo). Provisório: o modelo definitivo é escolhido
  # por benchmark no subconjunto do guardrail (T28). Custo de API zero; o custo é de infra.
  ollama-slm:
    provider: ollama
    kind: chat
    model: qwen3:4b
    max_output_tokens: 1000
    price_per_1m: {input: 0, cached_input: 0, output: 0}
  # Embeddings locais para o RAG (a Groq não oferece modelo de embeddings).
  ollama-embedding:
    provider: ollama
    kind: embedding
    model: nomic-embed-text:v1.5
    price_per_1m: {input: 0, cached_input: 0, output: 0}
