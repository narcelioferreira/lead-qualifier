[project]
name = "lead-qualifier"
version = "0.1.0"
description = "Agente LangGraph de qualificação de leads B2B com ontologia, RAG agêntico, LLM routing e MCP"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "tenacity>=9.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "trafilatura>=2.0",
    "langgraph>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "bandit>=1.8",
    "pip-audit>=2.7",
    "detect-secrets>=1.5",
    "pre-commit>=4.0",
    "respx>=0.22",
    "types-lxml>=2026.2.16",
    "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "tools_mcp", "evals"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # acentos/caracteres PT-BR em strings e comentários

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert é esperado em testes

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app", "tools_mcp", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = ["integration: testes que chamam serviços reais (exigem chaves no .env)"]

[tool.coverage.run]
source = ["app", "tools_mcp", "evals"]
branch = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
