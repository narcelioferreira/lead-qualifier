<svg xmlns="http://www.w3.org/2000/svg" class="viz" viewBox="0 0 884 450" width="884" height="450" role="img" aria-labelledby="t d">
<title id="t">Custo × acurácia por configuração</title>
<desc id="d">Acurácia contra o gabarito humano (IC 95%) e custo equivalente por lead (preço de lista da Groq, escala log), nos splits dev e test.</desc>
<style>
.viz { --surface:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e; --grid:#e6e5e1; --mark:#2a78d6; }
@media (prefers-color-scheme: dark) {
  .viz { --surface:#1a1a19; --ink:#f0efec; --ink-2:#c3c2b7; --grid:#33322f; --mark:#3987e5; }
}
.bg { fill: var(--surface); }
.title { fill: var(--ink); font: 600 16px system-ui, sans-serif; }
.panel { fill: var(--ink); font: 600 13px system-ui, sans-serif; }
.sub, .tick, .axis { fill: var(--ink-2); font: 12px system-ui, sans-serif; }
.label { fill: var(--ink); font: 600 12px system-ui, sans-serif; }
.grid { stroke: var(--grid); stroke-width: 1; }
.ci { stroke: var(--mark); stroke-width: 2; stroke-linecap: round; opacity: .45; }
.dot { fill: var(--mark); stroke: var(--surface); stroke-width: 2; }
</style>
<rect class="bg" width="884" height="450" rx="8"/>
<text class="title" x="64" y="30">Custo × acurácia por configuração</text>
<text class="sub" x="64" y="50">Acurácia contra o gabarito humano (barra: IC 95%) e custo equivalente por lead (preço de lista da Groq, escala log)</text>
<text class="panel" x="64.0" y="78">dev: 20 leads, usado no ajuste</text>
<line class="grid" x1="64.0" x2="424.0" y1="392.0" y2="392.0"/>
